name: Check

on:
  # A PR that changes only participant files is checked by participant-pr.yml,
  # which never runs the PR's code, so no maintainer has to approve a run.
  pull_request:
    paths-ignore: ["participants/*.json"]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Validate participants, requests, questionnaires, and catalog
        run: bun run check
      - name: Unit tests
        run: bun test tests
      - name: Typecheck
        run: bunx tsc --noEmit -p .
