name: tmp merge test
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT repos/${{ github.repository }}/pulls/9/merge -f merge_method=squash -i | head -30
        env: { GH_TOKEN: "${{ github.token }}" }
